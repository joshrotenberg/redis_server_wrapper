name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.19"
            otp: "27"
            redis: "7.2.14"
          - elixir: "1.20"
            otp: "29"
            redis: "7.2.14"

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache Redis
        id: redis-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/redis-server-wrapper/redis-${{ matrix.redis }}
          key: redis-tls-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.redis }}

      - name: Build Redis ${{ matrix.redis }}
        run: |
          bash .github/scripts/build-redis.sh \
            "${{ matrix.redis }}" \
            "${HOME}/.cache/redis-server-wrapper/redis-${{ matrix.redis }}"
          echo "${HOME}/.cache/redis-server-wrapper/redis-${{ matrix.redis }}/bin" >> "${GITHUB_PATH}"

      - name: Report Redis version
        run: redis-server --version

      - name: Restore deps cache
        uses: actions/cache@v6
        with:
          path: deps
          key: deps-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}

      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: |
            _build/dev/lib
            _build/test/lib
          key: build-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}-${{ hashFiles('lib/**/*.ex') }}
          restore-keys: |
            build-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Credo
        run: mix credo --strict

      - name: Restore PLT cache
        uses: actions/cache@v6
        with:
          path: _build/dev/*.plt
          key: plt-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}

      - name: Dialyzer
        run: mix dialyzer

      - name: Run tests
        if: matrix.elixir != '1.20' || matrix.otp != '29'
        run: mix test

      - name: Run tests with coverage gate
        if: matrix.elixir == '1.20' && matrix.otp == '29'
        run: mix test --cover

  redis-compatibility:
    name: Redis ${{ matrix.redis }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        redis: ["7.2.14", "7.4.9", "8.2.6", "8.8.0"]

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "27"

      - name: Cache Redis
        uses: actions/cache@v6
        with:
          path: ~/.cache/redis-server-wrapper/redis-${{ matrix.redis }}
          key: redis-tls-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.redis }}

      - name: Build Redis ${{ matrix.redis }}
        run: |
          bash .github/scripts/build-redis.sh \
            "${{ matrix.redis }}" \
            "${HOME}/.cache/redis-server-wrapper/redis-${{ matrix.redis }}"
          echo "${HOME}/.cache/redis-server-wrapper/redis-${{ matrix.redis }}/bin" >> "${GITHUB_PATH}"
          echo "REDIS_PREFIX=${HOME}/.cache/redis-server-wrapper/redis-${{ matrix.redis }}" >> "${GITHUB_ENV}"

      - name: Build version-matrix module
        run: |
          cc -fPIC -shared \
            -I "${REDIS_PREFIX}/include" \
            test/support/version_matrix_module.c \
            -o "${RUNNER_TEMP}/version_matrix_module.so"
          echo "REDIS_TEST_MODULE=${RUNNER_TEMP}/version_matrix_module.so" >> "${GITHUB_ENV}"

      - name: Report Redis version
        run: redis-server --version

      - name: Restore deps cache
        uses: actions/cache@v6
        with:
          path: deps
          key: compat-deps-1.19-27-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Run standalone, Cluster, Sentinel, and module tests
        run: mix test

      - name: Run shipped module-loading example
        env:
          REDIS_MODULE: ${{ env.REDIS_TEST_MODULE }}
          REDIS_MODULE_NAME: wrapper_version_matrix
        run: mix run examples/module_loading.exs

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "27"

      - name: Restore deps cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-docs-1.19-27-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Build docs
        run: mix docs
